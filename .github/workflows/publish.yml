name: 인스타 예약 게시

on:
  schedule:
    - cron: "17 * * * *"        # 매시 17분 실행 (게시 시각이 지난 항목만 올림)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 실제로 올리지 않고 올릴 목록만 확인"
        default: "false"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 게시
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          PAGES_BASE: ${{ vars.PAGES_BASE || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          PAUSED: ${{ vars.PAUSED }}
          MAX_FEED: ${{ vars.MAX_FEED || '1' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python tools/publish.py
      - name: 게시 기록 저장
        if: always()
        run: |
          python tools/board.py || true
          git config user.name "insta-bot"
          git config user.email "insta-bot@users.noreply.github.com"
          git add state docs
          if ! git diff --cached --quiet; then
            git commit -m "게시 기록 갱신 $(TZ=Asia/Seoul date +'%m-%d %H:%M')"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
